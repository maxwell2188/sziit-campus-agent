<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>深信院校园办事助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --primary: #0F52BA;
    --primary-light: #3B82F6;
    --primary-dark: #0A3A8A;
    --accent: #00D4FF;
    --success: #10B981;
    --warning: #F59E0B;
    --error: #EF4444;
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --text: #0F172A;
    --text2: #64748B;
    --text3: #94A3B8;
    --border: #E2E8F0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #E2E8F0;
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* 手机外框 */
  .phone-frame {
    width: 100%;
    max-width: 390px;
    height: 100vh;
    max-height: 844px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }

  @media (max-width: 500px) {
    .phone-frame { max-width: 100%; max-height: 100vh; border-radius: 0; }
    body { background: var(--bg); }
  }

  /* 状态栏 */
  .status-bar {
    height: 44px;
    background: transparent;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    font-size: 14px;
    font-weight: 600;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding-top: 8px;
  }

  /* 页面容器 */
  .page {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: none;
    flex-direction: column;
  }
  .page.active { display: flex; }

  /* ===== 首页 ===== */
  #homePage .home-hero {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 60%, var(--accent) 100%);
    color: white;
    padding: 60px 20px 28px;
    position: relative;
    overflow: hidden;
  }
  #homePage .home-hero::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
    border-radius: 50%;
  }
  #homePage .greeting { font-size: 14px; opacity: 0.9; margin-bottom: 4px; }
  #homePage .hero-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
  #homePage .search-entry {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    border: 1px solid rgba(255,255,255,0.3);
    cursor: pointer;
    position: relative;
    z-index: 1;
  }
  #homePage .search-entry span.icon { font-size: 16px; }
  #homePage .search-entry span.text { opacity: 0.9; flex: 1; }

  #homePage .home-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 80px;
  }

  .section-label {
    font-size: 15px;
    font-weight: 600;
    margin: 8px 0 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-label .more { font-size: 12px; color: var(--text3); font-weight: 400; }

  .scene-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .scene-card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 1px 3px rgba(15,82,186,0.06);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .scene-card:active {
    transform: scale(0.96);
    box-shadow: 0 2px 8px rgba(15,82,186,0.1);
  }
  .scene-card .icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 10px;
  }
  .scene-card .name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .scene-card .desc { font-size: 11px; color: var(--text3); }

  .scene-card.wide {
    grid-column: span 2;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .scene-card.wide .icon { margin-bottom: 0; flex-shrink: 0; }
  .scene-card.wide .text { flex: 1; }
  .scene-card.wide .arrow { font-size: 18px; color: var(--text3); }

  .history-list {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(15,82,186,0.06);
    border: 1px solid var(--border);
  }
  .history-item {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item:active { background: var(--bg); }
  .history-item .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .history-item .text { flex: 1; font-size: 13px; }
  .history-item .time { font-size: 11px; color: var(--text3); }

  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    padding: 10px 12px;
    padding-bottom: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .bottom-bar input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
    background: var(--bg);
    font-family: inherit;
  }
  .bottom-bar input:focus { border-color: var(--primary); background: white; }
  .send-btn {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    flex-shrink: 0;
    cursor: pointer;
    border: none;
    transition: transform 0.15s;
  }
  .send-btn:active { transform: scale(0.9); }

  /* ===== 对话页 ===== */
  #chatPage .chat-header {
    background: var(--card);
    padding: 48px 12px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
    z-index: 10;
  }
  .back-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--text2);
    cursor: pointer;
    border-radius: 8px;
  }
  .back-btn:active { background: var(--bg); }
  .chat-scene-tag {
    flex: 1;
    background: linear-gradient(135deg, rgba(15,82,186,0.08), rgba(0,212,255,0.08));
    color: var(--primary);
    padding: 6px 14px;
    border-radius: 18px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }
  .more-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    font-size: 18px;
    cursor: pointer;
    border-radius: 8px;
  }

  #chatPage .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px;
    padding-bottom: 80px;
  }

  .msg {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    max-width: 85%;
    animation: msgIn 0.3s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    margin-left: auto;
    flex-direction: row-reverse;
  }
  .msg .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .msg.bot .avatar {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
  }
  .msg.user .avatar {
    background: #E2E8F0;
    color: var(--text2);
    font-size: 13px;
    font-weight: 600;
  }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
  }
  .msg.bot .bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    border-top-right-radius: 4px;
  }

  .option-cards {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
  }
  .option-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    color: var(--primary);
    text-align: center;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .option-card:active {
    background: rgba(15,82,186,0.1);
    transform: scale(0.98);
  }

  /* 结构化结果卡片 */
  .result-card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    margin-top: 8px;
    box-shadow: 0 1px 3px rgba(15,82,186,0.06);
    border: 1px solid var(--border);
  }
  .result-card .rc-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-card .rc-title .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(16,185,129,0.1);
    color: var(--success);
    font-weight: 600;
  }
  .result-card .rc-title .badge.warn {
    background: rgba(245,158,11,0.1);
    color: var(--warning);
  }
  .check-list { list-style: none; }
  .check-list li {
    font-size: 13px;
    padding: 4px 0;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    color: var(--text2);
  }
  .check-list li .c-icon { flex-shrink: 0; font-size: 14px; }
  .check-list li.ok .c-icon { color: var(--success); }
  .check-list li.warn .c-icon { color: var(--warning); }

  .material-box {
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    margin-top: 8px;
  }
  .material-box .m-icon { font-size: 32px; margin-bottom: 6px; }
  .material-box .m-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .material-box .m-desc { font-size: 11px; color: var(--text3); margin-bottom: 10px; }
  .m-actions { display: flex; gap: 8px; justify-content: center; }
  .m-btn {
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  .m-btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
  }
  .m-btn.outline {
    background: white;
    color: var(--primary);
    border: 1px solid var(--primary) !important;
  }

  .warning-box {
    background: linear-gradient(135deg, rgba(245,158,11,0.08), rgba(239,68,68,0.04));
    border-left: 3px solid var(--warning);
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    color: var(--text2);
    margin-top: 8px;
    line-height: 1.6;
  }
  .warning-box .w-title {
    font-weight: 600;
    color: var(--warning);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }

  /* 进度步骤条 */
  .steps-bar {
    display: flex;
    justify-content: space-between;
    padding: 16px 16px 12px;
    background: var(--card);
    position: relative;
  }
  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
    position: relative;
    z-index: 2;
  }
  .step .circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
  }
  .step.active .circle { background: var(--success); color: white; }
  .step.current .circle {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    box-shadow: 0 0 0 4px rgba(15,82,186,0.15);
    animation: pulse-ring 2s ease-in-out infinite;
  }
  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 0 4px rgba(15,82,186,0.15); }
    50% { box-shadow: 0 0 0 8px rgba(15,82,186,0.08); }
  }
  .step .label { font-size: 10px; color: var(--text3); }
  .step.current .label { color: var(--primary); font-weight: 600; }
  .step.active .label { color: var(--success); font-weight: 600; }
  .progress-line {
    position: absolute;
    top: 30px;
    left: 20%;
    right: 20%;
    height: 2px;
    background: var(--border);
  }
  .progress-line-fill {
    height: 100%;
    background: var(--success);
    transition: width 0.5s ease;
  }

  /* 加载动画 */
  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text3);
    animation: typing 1.4s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* 输入栏 */
  .chat-input-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    padding: 10px 12px;
    padding-bottom: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    font-size: 18px;
    flex-shrink: 0;
    cursor: pointer;
    border-radius: 50%;
  }
  .icon-btn:active { background: var(--bg); }
  .chat-input-bar input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 14px;
    outline: none;
    background: var(--bg);
    font-family: inherit;
  }
  .chat-input-bar input:focus { border-color: var(--primary); background: white; }

  /* 切换动画 */
  .page { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- 状态栏 -->
  <div class="status-bar" style="color: white;" id="statusBar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <!-- ===== 首页 ===== -->
  <div class="page active" id="homePage">
    <div class="home-hero">
      <div class="greeting">同学，你好 👋</div>
      <div class="hero-title">校园办事助手</div>
      <div class="search-entry" onclick="goToChat('general')">
        <span class="icon">🔍</span>
        <span class="text">有什么可以帮你的？</span>
      </div>
    </div>

    <div class="home-content">
      <div class="section-label">
        <span>快捷办事</span>
        <span class="more">全部 ›</span>
      </div>
      
      <div class="scene-grid">
        <div class="scene-card" onclick="goToChat('scholarship')">
          <div class="icon" style="background:rgba(15,82,186,0.1);color:#0F52BA;">🎓</div>
          <div class="name">奖助学金</div>
          <div class="desc">申请全指引</div>
        </div>
        <div class="scene-card" onclick="goToChat('repair')">
          <div class="icon" style="background:rgba(16,185,129,0.1);color:#10B981;">🔧</div>
          <div class="name">宿舍报修</div>
          <div class="desc">一键报修</div>
        </div>
        <div class="scene-card wide" onclick="goToChat('academic')">
          <div class="icon" style="background:rgba(245,158,11,0.1);color:#F59E0B;">📋</div>
          <div class="text">
            <div class="name">学业资格自查</div>
            <div class="desc">奖学金/毕业资格智能评估</div>
          </div>
          <span class="arrow">›</span>
        </div>
      </div>

      <div class="section-label">
        <span>最近对话</span>
        <span class="more">查看全部</span>
      </div>

      <div class="history-list">
        <div class="history-item" onclick="goToChat('scholarship')">
          <div class="dot" style="background:var(--success);"></div>
          <div class="text">国家励志奖学金申请条件</div>
          <div class="time">今天</div>
        </div>
        <div class="history-item" onclick="goToChat('repair')">
          <div class="dot" style="background:var(--warning);"></div>
          <div class="text">宿舍空调不制冷报修</div>
          <div class="time">昨天</div>
        </div>
        <div class="history-item" onclick="goToChat('academic')">
          <div class="dot" style="background:var(--primary);"></div>
          <div class="text">学业奖学金资格自查</div>
          <div class="time">3天前</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <input type="text" id="homeInput" placeholder="输入你的问题..." onkeypress="if(event.key==='Enter')sendFromHome()">
      <button class="send-btn" onclick="sendFromHome()">➤</button>
    </div>
  </div>

  <!-- ===== 对话页 ===== -->
  <div class="page" id="chatPage">
    <div class="chat-header">
      <div class="back-btn" onclick="goHome()">‹</div>
      <div class="chat-scene-tag" id="chatSceneTag">🎓 奖助学金咨询</div>
      <div class="more-btn">⋯</div>
    </div>

    <div class="chat-body" id="chatBody">
      <!-- 消息动态生成 -->
    </div>

    <div class="chat-input-bar">
      <div class="icon-btn">🎙️</div>
      <input type="text" id="chatInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendUserMsg()">
      <div class="icon-btn">📷</div>
      <button class="send-btn" onclick="sendUserMsg()">➤</button>
    </div>
  </div>
</div>

<script>
  // 场景配置
  const scenes = {
    scholarship: {
      name: '🎓 奖助学金咨询',
      statusColor: 'white',
      heroBg: true,
      firstBotMsg: '你好！我是校园办事助手，专门为你解答奖助学金相关问题。请问你想咨询哪类奖助学金？',
      options: [
        '🏆 国家奖学金（8000元/年）',
        '⭐ 国家励志奖学金（5000元/年）',
        '💰 国家助学金（最高4200元/年）',
        '📚 学业奖学金'
      ]
    },
    repair: {
      name: '🔧 宿舍报修服务',
      statusColor: 'white',
      heroBg: true,
      firstBotMsg: '你好！宿舍设施有问题随时找我。请问是什么东西坏了呀？',
      options: [
        '💡 灯/水电问题',
        '❄️ 空调不制冷/制热',
        '🚪 家具/门窗/门锁',
        '🔍 其他问题'
      ]
    },
    academic: {
      name: '📋 学业资格自查',
      statusColor: 'white',
      heroBg: true,
      firstBotMsg: '你好！我可以帮你自查奖学金资格和毕业资格。请问你想查什么？',
      options: [
        '🏆 学业奖学金资格',
        '🎓 毕业资格自查',
        '📊 综测加分计算',
        '🥇 评优评先条件'
      ]
    },
    general: {
      name: '💬 校园办事助手',
      statusColor: 'var(--text)',
      heroBg: false,
      firstBotMsg: '你好！我是深信院校园办事助手，可以帮你处理：\n\n🎓 奖助学金申请\n🔧 宿舍后勤报修\n📋 学业资格自查\n\n请问有什么可以帮你的？',
      options: [
        '🎓 奖助学金咨询',
        '🔧 宿舍报修',
        '📋 学业资格自查'
      ]
    }
  };

  let currentScene = 'scholarship';
  let chatStep = 0;

  // 跳转到对话页
  function goToChat(scene) {
    currentScene = scene;
    chatStep = 0;
    
    // 更新场景标签
    document.getElementById('chatSceneTag').textContent = scenes[scene].name;
    
    // 清空消息
    document.getElementById('chatBody').innerHTML = '';
    
    // 切换页面
    document.getElementById('homePage').classList.remove('active');
    document.getElementById('chatPage').classList.add('active');
    
    // 更新状态栏颜色
    const sb = document.getElementById('statusBar');
    sb.style.color = 'var(--text)';
    
    // 显示首条消息
    setTimeout(() => {
      addBotMsg(scenes[scene].firstBotMsg, scenes[scene].options);
    }, 300);
  }

  // 返回首页
  function goHome() {
    document.getElementById('chatPage').classList.remove('active');
    document.getElementById('homePage').classList.add('active');
    document.getElementById('statusBar').style.color = 'white';
  }

  // 从首页发送
  function sendFromHome() {
    const input = document.getElementById('homeInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    goToChat('general');
    setTimeout(() => {
      addUserMsg(text);
      setTimeout(() => {
        showTyping();
        setTimeout(() => {
          removeTyping();
          addBotMsg('好的，我来帮你处理这个问题。为了更准确地帮到你，请问你是想咨询哪方面的办事呢？', [
            '🎓 奖助学金咨询',
            '🔧 宿舍报修',
            '📋 学业资格自查'
          ]);
        }, 1200);
      }, 500);
    }, 400);
  }

  // 添加Bot消息
  function addBotMsg(text, options = null, hasResult = false) {
    const body = document.getElementById('chatBody');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg bot';
    
    let bubbleHtml = text.replace(/\n/g, '<br>');
    
    if (options) {
      bubbleHtml += `<div class="option-cards">`;
      options.forEach(opt => {
        bubbleHtml += `<div class="option-card" onclick="selectOption('${opt}')">${opt}</div>`;
      });
      bubbleHtml += `</div>`;
    }
    
    msgDiv.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">${bubbleHtml}</div>
    `;
    
    body.appendChild(msgDiv);
    scrollToBottom();
  }

  // 添加用户消息
  function addUserMsg(text) {
    const body = document.getElementById('chatBody');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg user';
    msgDiv.innerHTML = `
      <div class="avatar">我</div>
      <div class="bubble">${text}</div>
    `;
    body.appendChild(msgDiv);
    scrollToBottom();
  }

  // 显示打字动画
  function showTyping() {
    const body = document.getElementById('chatBody');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg bot';
    msgDiv.id = 'typingMsg';
    msgDiv.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    `;
    body.appendChild(msgDiv);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typingMsg');
    if (el) el.remove();
  }

  // 选择选项
  function selectOption(optionText) {
    addUserMsg(optionText);
    chatStep++;
    
    showTyping();
    
    setTimeout(() => {
      removeTyping();
      handleReply(optionText);
    }, 1000);
  }

  // 发送用户消息
  function sendUserMsg() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addUserMsg(text);
    
    showTyping();
    setTimeout(() => {
      removeTyping();
      addBotMsg('好的，我来帮你查询一下相关信息。这个问题涉及的内容比较多，我整理一下：', [
        '查看办事流程',
        '准备材料清单',
        '常见问题解答'
      ]);
    }, 1000);
  }

  // 处理回复逻辑

                <li class="ok"><span class="c-icon">✓</span>家庭经济困难认定（需确认）</li>

                <li class="warn"><span class="c-icon">⚠</span>需确认评选年度内无不及格科目</li>

            </div>
            
            <div class="result-card">

                <div class="m-desc">共 6 项材料 · 含官方模板</div>
                <div class="m-actions">

              </div>

            </div>

        `;
        body.appendChild(resultDiv);

        setTimeout(() => {

          '什么时候截止申请？'

                <button style="flex:1; padding:10px; border-radius:20px; border:1px solid var(--border); background:white; color:var(--text2); font-weight:500; font-size:13px; cursor:pointer;">修改信息</button>

        `;
        body.appendChild(resultDiv);
        scrollToBottom();
      } else {

      }
      
    } else if (scene === 'academic') {
      if (chatStep === 1) {

    } else {
      // 通用场景

        addBotMsg(scenes.scholarship.firstBotMsg, scenes.scholarship.options);

  // 滚动到底部
  function scrollToBottom() {
    const body = document.getElementById('chatBody');

  }

  // 初始化
  document.getElementById('homeInput').focus();
